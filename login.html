<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
    
<body>
    <main class="area-cadastro">
        <section>
            <h1>Login</h1>
        </section>

        <!-- CABEÇALHO -->
    <header id="navbar">
        <img src="imagem/logo.png" alt="Logo" class="logo">

        <ul id="nav-list">

            <li class="nav-item">
                <a href="#" class="nav-link">Início</a>
            </li>

            <li class="nav-item">
                <a href="#" class="nav-link">Projetos</a>
            </li>

            <li class="nav-item">
                <a href="#" class="nav-link active">Contatos</a>
            </li>

            <li class="nav-item">
                <a href="#" class="nav-link">Sobre</a>
            </li>

        </ul>

        <a href="#contact_form" class="login-link">
            Contatar
        </a>

    </header>

        <section class="area-formulario">
            <form action="#" class="form-cadastro" id="form-logar">
                <div class="area-acesso formatacao">
                    <div class="email titulo-campo">
                        <label for="email">email</label>
                        <input type="email" id="email" placeholder="digite seu email" required>
                    </div>
                
                    <div class="senha titulo-campo">
                        <label for="senha">senha</label>
                        <input type="password" id="senha" placeholder="••••••" required>
                        <a href="#" class="esqueci-senha">Esqueci a senha</a>
                    </div>

                     <div class="area-botão formatacao titulo-campo">
                    <button type="submit" id="botão-cadastrar">Fazer login</button>
                    <a href="cadastro.html" class="link-login"> Não tem uma conta? Crie uma agora </a>
                    </div>
                </div>
            </form>
        </section>
    </main>
    
    <script src="javascript/login-cadastro.js"></script>
    
</body>
</html>
