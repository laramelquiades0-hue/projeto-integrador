    <header id="navbar">
        <img src="imagem/logo.png" alt="Logo" class="logo">

        <ul id="nav-list">

            <li class="nav-item">
                <a href="#" class="nav-link">Início</a>

        <a href="#contact_form" class="login-link">
            Contatar

    </header>

    <div class="container-form">

        <h2>Cadastrar Novo Card</h2>



        <form id="form-criar-card">

            <div class="campo">

                <label for="titulo-card">Título do Item:</label>

                <input type="text" id="titulo-card" placeholder="Ex: Notebook Dell" required>

            </div>



            <div class="campo">

                <label for="preco-card">Preço (R$):</label>

                <input type="number" id="preco-card" step="0.01" placeholder="Ex: 2500.00" required>

            </div>



            <div class="campo">

                <label for="imagem-card">URL da Imagem:</label>

                <input type="url" id="imagem-card" placeholder="https://exemplo.com/imagem.jpg">

            </div>



            <div class="campo">

                <label for="descricao-card">Descrição:</label>

                <textarea id="descricao-card" rows="4" placeholder="Escreva os detalhes aqui..."></textarea>

            </div>



            <button type="submit" class="btn-enviar">Adicionar ao Catálogo</button>

        </form>

    </div>

    <script src="javascript/card.js"></script>
    <script src="javascript/catalogo.js"></script>
